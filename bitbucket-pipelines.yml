image:  atlassian/default-image:5

clone:
  depth: full              # SonarCloud scanner needs the full history to assign issues properly

definitions:
  caches:
    sonar: ~/.sonar/cache  # Caching SonarCloud artifacts will speed up your build
  steps:
    - step: &build-test-sonarcloud
        name: Build, test and analyze on SonarCloud
        caches:
          - sonar
        script:
          - export SONAR_SCANNER_VERSION=6.2.1.4610
          - export SONAR_SCANNER_HOME=$HOME/.sonar/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64
          - export BW_OUTPUT=$HOME/.sonar/bw-output
          - mkdir -p $BW_OUTPUT
          - apt-get update -qq
          - apt-get install openjdk-21-jre cmake -y
          - curl --create-dirs -sSLo $HOME/.sonar/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip
          - unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
          - export PATH=$SONAR_SCANNER_HOME/bin:$PATH
          - curl --create-dirs -sSLo $HOME/.sonar/build-wrapper-linux-x86.zip https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          - unzip -o $HOME/.sonar/build-wrapper-linux-x86.zip -d $HOME/.sonar/
          - export PATH=$HOME/.sonar/build-wrapper-linux-x86:$PATH
          - apt-get update -qq
          - apt-get install cmake -y --force-yes
          - mkdir build
          - cmake . -Bbuild
          - build-wrapper-linux-x86-64 --out-dir $BW_OUTPUT cmake --build build
          - sonar-scanner -Dsonar.cfamily.build-wrapper-output=$BW_OUTPUT

    - step: &java-model-gen
        name: Build Java model generator and run on example CID files
        image: eclipse-temurin:17
        script:
          - mkdir -p tools/model_generator/build
          - find tools/model_generator/src/ -name "*.java" > listFile.tmp
          - javac -d tools/model_generator/build @listFile.tmp
          - jar cfm tools/model_generator/genmodel.jar tools/model_generator/manifest.mf -C tools/model_generator/build/ com/
          - jar cfm tools/model_generator/genconfig.jar tools/model_generator/manifest-dynamic.mf -C tools/model_generator/build/ com/
          - rm listFile.tmp && rm -rf tools/model_generator/build
          - mkdir -p java_outputs
          - java -jar tools/model_generator/genmodel.jar examples/server_example_goose/simpleIO_direct_control_goose.cid -out java_outputs/goose
          - java -jar tools/model_generator/genmodel.jar examples/server_example_basic_io/simpleIO_direct_control.cid -out java_outputs/basic_io
          - java -jar tools/model_generator/genmodel.jar examples/server_example_write_handler/complexModel.cid -out java_outputs/complex
          - java -jar tools/model_generator/genconfig.jar examples/server_example_goose/simpleIO_direct_control_goose.cid java_outputs/goose.cfg
          - java -jar tools/model_generator/genconfig.jar examples/server_example_basic_io/simpleIO_direct_control.cid java_outputs/basic_io.cfg
          - java -jar tools/model_generator/genconfig.jar examples/server_example_write_handler/complexModel.cid java_outputs/complex.cfg
        artifacts:
          - java_outputs/**

    - step: &dotnet-model-gen-compare
        name: Build .NET model generator, run on example CID files, compare with Java output
        image: mcr.microsoft.com/dotnet/sdk:8.0
        script:
          - dotnet build tools/model_generator_dotnet/Tools_ModelGenerator.sln
          - mkdir -p dotnet_outputs
          - dotnet tools/model_generator_dotnet/Tools/bin/Debug/net8.0/Tools.dll 1 examples/server_example_goose/simpleIO_direct_control_goose.cid -out dotnet_outputs/goose
          - dotnet tools/model_generator_dotnet/Tools/bin/Debug/net8.0/Tools.dll 1 examples/server_example_basic_io/simpleIO_direct_control.cid -out dotnet_outputs/basic_io
          - dotnet tools/model_generator_dotnet/Tools/bin/Debug/net8.0/Tools.dll 1 examples/server_example_write_handler/complexModel.cid -out dotnet_outputs/complex
          - dotnet tools/model_generator_dotnet/Tools/bin/Debug/net8.0/Tools.dll 2 examples/server_example_goose/simpleIO_direct_control_goose.cid -out dotnet_outputs/goose
          - dotnet tools/model_generator_dotnet/Tools/bin/Debug/net8.0/Tools.dll 2 examples/server_example_basic_io/simpleIO_direct_control.cid -out dotnet_outputs/basic_io
          - dotnet tools/model_generator_dotnet/Tools/bin/Debug/net8.0/Tools.dll 2 examples/server_example_write_handler/complexModel.cid -out dotnet_outputs/complex
          - |
            compare_outputs() {
              local java_file="$1"
              local dotnet_file="$2"
              # Strip line 2 (the output-path comment line) so java_outputs/ vs dotnet_outputs/ paths don't cause a false mismatch
              if ! diff -q <(sed '2d' "$java_file" | tr -d '[:space:]') <(sed '2d' "$dotnet_file" | tr -d '[:space:]') > /dev/null; then
                echo "MISMATCH: $java_file vs $dotnet_file"
                diff -u -w -B "$java_file" "$dotnet_file" || true
                return 1
              fi
              echo "OK: $java_file"
            }
            failed=0
            compare_outputs java_outputs/goose.c      dotnet_outputs/goose.c      || failed=1
            compare_outputs java_outputs/goose.h      dotnet_outputs/goose.h      || failed=1
            compare_outputs java_outputs/basic_io.c   dotnet_outputs/basic_io.c   || failed=1
            compare_outputs java_outputs/basic_io.h   dotnet_outputs/basic_io.h   || failed=1
            compare_outputs java_outputs/complex.c    dotnet_outputs/complex.c    || failed=1
            compare_outputs java_outputs/complex.h    dotnet_outputs/complex.h    || failed=1
            compare_outputs java_outputs/goose.cfg    dotnet_outputs/goose.cfg    || failed=1
            compare_outputs java_outputs/basic_io.cfg dotnet_outputs/basic_io.cfg || failed=1
            compare_outputs java_outputs/complex.cfg  dotnet_outputs/complex.cfg  || failed=1
            [ $failed -eq 0 ] && echo "All model generator outputs match!" || exit 1

    - step: &compile-check
        name: Compile generated static models together with example applications
        image: mcr.microsoft.com/dotnet/sdk:8.0
        script:
          - apt-get update -qq && apt-get install -y --no-install-recommends gcc libc6-dev
          - dotnet build tools/model_generator_dotnet/Tools_ModelGenerator.sln
          # Regenerate static models directly into each example directory so the
          # generated static_model.c includes static_model.h (matching the example's expectation)
          - dotnet tools/model_generator_dotnet/Tools/bin/Debug/net8.0/Tools.dll 1 examples/server_example_goose/simpleIO_direct_control_goose.cid -out examples/server_example_goose/static_model
          - dotnet tools/model_generator_dotnet/Tools/bin/Debug/net8.0/Tools.dll 1 examples/server_example_basic_io/simpleIO_direct_control.cid -out examples/server_example_basic_io/static_model
          - dotnet tools/model_generator_dotnet/Tools/bin/Debug/net8.0/Tools.dll 1 examples/server_example_write_handler/complexModel.cid -out examples/server_example_write_handler/static_model
          - |
            INCLUDES="-Iconfig -Ihal/inc -Isrc/common/inc -Isrc/mms/inc -Isrc/mms/inc_private -Isrc/mms/asn1 -Isrc/iec61850/inc -Isrc/iec61850/inc_private -Isrc/goose -Isrc/sampled_values -Isrc/logging -Isrc/tls -Isrc/r_session"
            compile_example() {
              local example_dir="$1"
              local server_src="$2"
              echo "Compiling $example_dir ..."
              gcc -c -o /dev/null $INCLUDES -I"$example_dir" "$example_dir/static_model.c" || { echo "FAIL: $example_dir/static_model.c"; return 1; }
              gcc -c -o /dev/null $INCLUDES -I"$example_dir" "$example_dir/$server_src"    || { echo "FAIL: $example_dir/$server_src"; return 1; }
              echo "OK: $example_dir"
            }
            failed=0
            compile_example examples/server_example_goose        server_example_goose.c        || failed=1
            compile_example examples/server_example_basic_io     server_example_basic_io.c     || failed=1
            compile_example examples/server_example_write_handler server_example_write_handler.c || failed=1
            [ $failed -eq 0 ] && echo "All examples compiled successfully!" || exit 1

    - step: &external-native-tests
        name: Run libiec61850-tests/v1.6
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends cmake build-essential git
          - git clone --branch v1.6 --single-branch git@bitbucket.org:mz-automation/libiec61850-tests.git libiec61850-tests
          - chmod +x libiec61850-tests/scripts/run-native-tests.sh
          - TEST_PROFILE=native LIBIEC61850_SOURCE_DIR="$BITBUCKET_CLONE_DIR" libiec61850-tests/scripts/run-native-tests.sh
        artifacts:
          - libiec61850-tests/test-results/**

    - step: &external-mbedtls-228-tests
        name: Run libiec61850-tests/v1.6 with mbedTLS 2.28
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends cmake build-essential git curl python3 ca-certificates bzip2
          - git clone --branch v1.6 --single-branch git@bitbucket.org:mz-automation/libiec61850-tests.git libiec61850-tests
          - chmod +x libiec61850-tests/scripts/prepare-test-dependency.sh libiec61850-tests/scripts/run-native-tests.sh
          - libiec61850-tests/scripts/prepare-test-dependency.sh "$BITBUCKET_CLONE_DIR" mbedtls-2.28
          - TEST_PROFILE=tls BUILD_DIR="$BITBUCKET_CLONE_DIR/build-mbedtls-2.28" RESULTS_DIR="$BITBUCKET_CLONE_DIR/libiec61850-tests/test-results/mbedtls-2.28" LIBIEC61850_SOURCE_DIR="$BITBUCKET_CLONE_DIR" libiec61850-tests/scripts/run-native-tests.sh
        artifacts:
          - libiec61850-tests/test-results/**

    - step: &external-mbedtls-36-tests
        name: Run libiec61850-tests/v1.6 with mbedTLS 3.6
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends cmake build-essential git curl python3 ca-certificates bzip2
          - git clone --branch v1.6 --single-branch git@bitbucket.org:mz-automation/libiec61850-tests.git libiec61850-tests
          - chmod +x libiec61850-tests/scripts/prepare-test-dependency.sh libiec61850-tests/scripts/run-native-tests.sh
          - libiec61850-tests/scripts/prepare-test-dependency.sh "$BITBUCKET_CLONE_DIR" mbedtls-3.6
          - TEST_PROFILE=tls BUILD_DIR="$BITBUCKET_CLONE_DIR/build-mbedtls-3.6" RESULTS_DIR="$BITBUCKET_CLONE_DIR/libiec61850-tests/test-results/mbedtls-3.6" LIBIEC61850_SOURCE_DIR="$BITBUCKET_CLONE_DIR" libiec61850-tests/scripts/run-native-tests.sh
        artifacts:
          - libiec61850-tests/test-results/**

    - step: &external-sqlite-tests
        name: Run libiec61850-tests/v1.6 with SQLite
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends cmake build-essential git curl python3 ca-certificates
          - git clone --branch v1.6 --single-branch git@bitbucket.org:mz-automation/libiec61850-tests.git libiec61850-tests
          - chmod +x libiec61850-tests/scripts/prepare-test-dependency.sh libiec61850-tests/scripts/run-native-tests.sh
          - libiec61850-tests/scripts/prepare-test-dependency.sh "$BITBUCKET_CLONE_DIR" sqlite
          - TEST_PROFILE=sqlite BUILD_DIR="$BITBUCKET_CLONE_DIR/build-sqlite" RESULTS_DIR="$BITBUCKET_CLONE_DIR/libiec61850-tests/test-results/sqlite" LIBIEC61850_SOURCE_DIR="$BITBUCKET_CLONE_DIR" libiec61850-tests/scripts/run-native-tests.sh
        artifacts:
          - libiec61850-tests/test-results/**

    - step: &native-coverage
        name: Generate native C coverage report
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends cmake build-essential git lcov
          - git clone --branch v1.6 --single-branch git@bitbucket.org:mz-automation/libiec61850-tests.git libiec61850-tests
          - chmod +x libiec61850-tests/scripts/run-native-tests.sh
          - mkdir -p coverage/html
          - |
            set +e
            TEST_PROFILE=native \
              BUILD_DIR="$BITBUCKET_CLONE_DIR/build-coverage" \
              RESULTS_DIR="$BITBUCKET_CLONE_DIR/libiec61850-tests/test-results/coverage" \
              LIBIEC61850_SOURCE_DIR="$BITBUCKET_CLONE_DIR" \
              CFLAGS="--coverage -fprofile-update=atomic -O0 -g" \
              CXXFLAGS="--coverage -fprofile-update=atomic -O0 -g" \
              LDFLAGS="--coverage" \
              libiec61850-tests/scripts/run-native-tests.sh
            test_status=$?
            set -e

            coverage_status=0
            lcov --capture \
              --directory build-coverage \
              --output-file coverage/raw.info \
              --rc branch_coverage=1 || coverage_status=$?

            if [ "$coverage_status" -eq 0 ]; then
              lcov --extract coverage/raw.info \
                "$BITBUCKET_CLONE_DIR/src/*" \
                "$BITBUCKET_CLONE_DIR/hal/*" \
                --output-file coverage/libiec61850.info \
                --rc branch_coverage=1 || coverage_status=$?
            fi

            if [ "$coverage_status" -eq 0 ]; then
              genhtml coverage/libiec61850.info \
                --output-directory coverage/html \
                --branch-coverage \
                --title "libiec61850 native test coverage" || coverage_status=$?
            fi

            if [ "$test_status" -ne 0 ]; then
              echo "Native tests failed with exit code $test_status"
              exit "$test_status"
            fi

            if [ "$coverage_status" -ne 0 ]; then
              echo "Coverage report generation failed with exit code $coverage_status"
              exit "$coverage_status"
            fi
        artifacts:
          - coverage/html/**
          - coverage/libiec61850.info
          - libiec61850-tests/test-results/coverage/**

    - step: &dotnet-wrapper-tests
        name: Run .NET wrapper tests
        image: mcr.microsoft.com/dotnet/sdk:8.0
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends cmake build-essential
          - cmake -S . -B build-dotnet -DBUILD_EXAMPLES=OFF
          - cmake --build build-dotnet --parallel $(nproc)
          - export LD_LIBRARY_PATH="$BITBUCKET_CLONE_DIR/build-dotnet/src:${LD_LIBRARY_PATH:-}"
          - cd dotnet/tests
          - dotnet test tests.csproj --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=dotnet-wrapper-tests.trx"
        artifacts:
          - dotnet/tests/TestResults/**

pipelines:                 # More info here: https://confluence.atlassian.com/bitbucket/configure-bitbucket-pipelines-yml-792298910.html
  branches:
    master:
      - step: *build-test-sonarcloud
    v1.6_develop:
      - step: *build-test-sonarcloud
      - parallel:
          - step: *external-native-tests
          - step: *external-mbedtls-228-tests
          - step: *external-mbedtls-36-tests
          - step: *external-sqlite-tests
          - step: *native-coverage
      - step: *dotnet-wrapper-tests
  pull-requests:
    '**':
      - step: *build-test-sonarcloud
      - parallel:
          - step: *external-native-tests
          - step: *external-mbedtls-228-tests
          - step: *external-mbedtls-36-tests
          - step: *external-sqlite-tests
          - step: *native-coverage
      - step: *dotnet-wrapper-tests
  custom:
    compare-model-generators:
      - step: *java-model-gen
      - step: *dotnet-model-gen-compare
      - step: *compile-check
    external-native-tests:
      - step: *external-native-tests
    external-mbedtls-2.28-tests:
      - step: *external-mbedtls-228-tests
    external-mbedtls-3.6-tests:
      - step: *external-mbedtls-36-tests
    external-sqlite-tests:
      - step: *external-sqlite-tests
    native-coverage:
      - step: *native-coverage
    dotnet-wrapper-tests:
      - step: *dotnet-wrapper-tests
